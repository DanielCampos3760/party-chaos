<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Chaos - Local Multiplayer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #6366f1; --text: #f8fafc; --subtext: #94a3b8; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
    h1 { margin: 10px 0 20px 0; font-size: 2rem; color: #a855f7; }
    .card { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); box-sizing: border-box; margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem; box-sizing: border-box; }
    button { background: var(--accent); border: none; font-weight: 700; cursor: pointer; }
    .hidden { display: none !important; }
    .player-badge { display: inline-flex; background: #334155; padding: 8px 14px; border-radius: 20px; margin: 4px; font-weight: 600; }
    .role-box { background: #334155; border-left: 4px solid var(--accent); padding: 16px; border-radius: 8px; margin-top: 16px; text-align: left; }
    .timer { font-size: 2.5rem; font-weight: 800; color: #ef4444; text-align: center; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>🎉 PARTY CHAOS</h1>

  <div id="login-card" class="card">
    <label>Nombre de Jugador</label>
    <input type="text" id="player-name" placeholder="Ej. Carlos" maxlength="15">
    <label>Avatar</label>
    <select id="player-avatar">
      <option value="👑">👑 Rey</option>
      <option value="🐺">🐺 Lobo</option>
      <option value="🍺">🍺 Cerveza</option>
      <option value="🔥">🔥 Fuego</option>
    </select>
    <button onclick="createRoom()">Crear Nueva Sala</button>
    <hr style="border-color: #334155; margin: 12px 0;">
    <input type="text" id="room-code" placeholder="Código (4 letras)" style="text-transform: uppercase;">
    <button onclick="joinRoom()" style="background: #10b981;">Unirse a Sala</button>
  </div>

  <div id="lobby-card" class="card hidden">
    <div style="text-align: center;">
      <span style="color: var(--subtext);">CÓDIGO DE SALA</span>
      <h2 id="display-code" style="font-size: 2.5rem; color: #38bdf8; margin: 4px 0;"></h2>
    </div>
    <h3>Jugadores en la sala:</h3>
    <div id="players-list"></div>

    <div id="host-controls" class="hidden" style="margin-top: 24px; border-top: 1px solid #334155; padding-top: 16px;">
      <h3>Configurar Partida (Anfitrión)</h3>
      <select id="game-select">
        <option value="witch_hunt">Caza de Brujas (Roles / Deducción)</option>
        <option value="impostor">El Impostor (Palabra Secreta)</option>
        <option value="time_bomb">Bomba de Tiempo (Trivia Rápida)</option>
      </select>
      <label>Tiempo de Discusión (Segundos)</label>
      <input type="number" id="game-timer" value="60" min="15" max="300">
      <button onclick="startGame()" style="background: #a855f7;">¡Iniciar Juego!</button>
    </div>
  </div>

  <div id="game-card" class="card hidden">
    <h2 id="game-title" style="color: #f59e0b; margin-top: 0; text-align: center;"></h2>
    <p id="game-desc" style="color: var(--subtext); text-align: center;"></p>
    <div id="game-timer-display" class="timer">--</div>
    <div id="secret-box" class="role-box"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
